name: Picture-match accuracy test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build CardSight data"]
    types: [completed]
jobs:
  eval:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1 > /dev/null
          pip install -q mediapipe numpy pillow
      - run: python tools/eval_pictures.py
