name: Fingerprint size test
on:
  workflow_dispatch:
  push:
    paths: ["tools/eval_dims.py", ".github/workflows/eval-dims.yml"]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1 > /dev/null
          pip install -q mediapipe numpy pillow
      - run: python tools/eval_dims.py
