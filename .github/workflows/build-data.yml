name: Build CardSight data

on:
  schedule:
    - cron: "23 23 * * *"   # daily, after TCGdex refreshes prices (~22:15 UTC)
  workflow_dispatch:
  push:
    paths: ["build_data.py", "picture_model.txt", ".github/workflows/build-data.yml"]

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1 p7zip-full > /dev/null
          pip install -q mediapipe numpy pillow onnxruntime opencv-python-headless
      - name: Reuse previous fingerprints
        run: |
          mkdir -p cache
          curl -fsSL -o cache/embcache.npz \
            "https://github.com/${{ github.repository }}/releases/download/latest/embcache.npz" || echo "no previous cache"
          curl -fsSL -o cache/history.json.gz \
            "https://github.com/${{ github.repository }}/releases/download/latest/history.json.gz" || echo "no previous history"
      - name: Fetch the trained picture model (if one has been chosen)
        run: |
          R="https://github.com/${{ github.repository }}/releases/download"
          if [ -f picture_model.txt ]; then
            P="$(tr -d '[:space:]' < picture_model.txt)"
            curl -fsSL -o cache/cardnet.onnx "$R/exp/${P}_cardnet.onnx"
            curl -fsSL -o cache/gallery_seed.npz "$R/exp/${P}_gallery.npz" || echo "no seed"
            curl -fsSL -o cache/netcache.npz "$R/latest/netcache.npz" || echo "no trained-fingerprint cache yet"
          fi
      - name: Build data
        run: python build_data.py
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "CardSight data" \
              --notes "Daily card catalog, prices and picture fingerprints for the CardSight app. Rebuilt automatically."
          gh release upload latest out/catalog.json.gz out/emb.bin out/embedder.tflite out/embcache.npz out/history.json.gz out/sealed.json.gz --clobber
          if [ -f out/emb3.bin ]; then gh release upload latest out/emb3.bin out/cardnet.onnx out/netcache.npz --clobber; fi
          gh release upload latest out/manifest.json --clobber
      - name: Record build status (keeps the daily schedule active)
        if: github.event_name == 'schedule'
        run: |
          cp out/manifest.json status.json
          git config user.name "cardsight-bot"
          git config user.email "cardsight-bot@users.noreply.github.com"
          git add status.json
          git commit -m "Daily data build $(date -u +%Y-%m-%d)" || exit 0
          git push
